name: Publish ProofWeave to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure a Trusted Publishing compatible npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build CLI
        run: npm run check && npm run build:cli

      - name: Verify tag and CLI versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          cli_version="$(node dist-cli/proofweave.js --version)"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must equal v${package_version}." >&2
            exit 1
          fi
          if [[ "${cli_version}" != "${package_version}" ]]; then
            echo "CLI version ${cli_version} must equal package version ${package_version}." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "The tagged commit must be reachable from origin/main." >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
